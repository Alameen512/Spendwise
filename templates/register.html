{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SpendWise</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="sw-auth-wrap">
  <div class="sw-card sw-auth-card sw-fade-in">
    <a href="{% url 'home' %}" class="d-flex align-items-center gap-2 fw-bold fs-5 mb-4 text-decoration-none" style="color:var(--sw-text);">
      <span class="sw-logo-mark d-inline-flex align-items-center justify-content-center" style="width:34px;height:34px;">S</span>
      SpendWise
    </a>
    <h3 class="fw-bold mb-1">Create your account</h3>
    <p class="sw-text-muted mb-4">Start tracking your money in minutes.</p>

    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="row">
        <div class="col-6 mb-3">
          <label class="form-label">First name</label>
          <input type="text" class="form-control sw-input" name="first_name">
        </div>
        <div class="col-6 mb-3">
          <label class="form-label">Last name</label>
          <input type="text" class="form-control sw-input" name="last_name">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control sw-input" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control sw-input" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control sw-input" name="password" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input type="password" class="form-control sw-input" name="password2" required>
      </div>
      <button type="submit" class="btn sw-btn-primary w-100 py-2" id="registerSubmitBtn">
        <span class="btn-text">Create account</span>
        <span class="sw-spinner d-none" style="border-width:2px;width:16px;height:16px;"></span>
      </button>
    </form>

    <p class="text-center sw-text-muted mt-4 mb-0">
      Already have an account? <a href="{% url 'login' %}" class="sw-gradient-text fw-semibold">Login</a>
    </p>
  </div>
</div>

<div class="sw-toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.SW_API_BASE = "/api";</script>
<script src="{% static 'js/main.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
